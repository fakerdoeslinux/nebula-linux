<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#120a33"/>
      <stop offset="0.55" stop-color="#1d0b45"/>
      <stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b34bff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#7a2ff2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a2ff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39d7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39d7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.45" stop-color="#ffd447"/>
      <stop offset="1" stop-color="#ff9d1c"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="16" y="16" width="480" height="480" fill="url(#space)"/>
    <circle cx="150" cy="150" r="210" fill="url(#nebulaA)"/>
    <circle cx="410" cy="360" r="200" fill="url(#nebulaB)"/>
    <circle cx="360" cy="120" r="150" fill="url(#nebulaC)"/>

    <!-- starfield -->
    <g fill="#ffffff">
      <circle cx="96" cy="330" r="3.2" opacity="0.9"/>
      <circle cx="132" cy="398" r="2.2" opacity="0.65"/>
      <circle cx="410" cy="196" r="2.6" opacity="0.8"/>
      <circle cx="438" cy="248" r="1.8" opacity="0.55"/>
      <circle cx="352" cy="420" r="2.4" opacity="0.7"/>
      <circle cx="72" cy="236" r="2" opacity="0.5"/>
      <circle cx="452" cy="130" r="2.2" opacity="0.6"/>
      <circle cx="250" cy="86" r="1.8" opacity="0.45"/>
    </g>

    <!-- comet trail sweeping up from the dark corner -->
    <path d="M 108 470 C 190 402 232 348 262 288 C 288 236 322 196 372 168"
          fill="none" stroke="url(#trail)" stroke-width="34" stroke-linecap="round" opacity="0.55"/>
    <path d="M 108 470 C 190 402 232 348 262 288 C 288 236 322 196 372 168"
          fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

    <!-- the star -->
    <g filter="url(#glow)">
      <path d="M 332 128
               L 366 224
               L 466 228
               L 388 290
               L 414 388
               L 332 330
               L 250 388
               L 276 290
               L 198 228
               L 298 224 Z"
            fill="url(#starFill)"/>
    </g>
    <path d="M 332 128
             L 366 224
             L 466 228
             L 388 290
             L 414 388
             L 332 330
             L 250 388
             L 276 290
             L 198 228
             L 298 224 Z"
          fill="none" stroke="#fff3bd" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
    <!-- inner light -->
    <circle cx="320" cy="248" r="34" fill="#fff9d8" opacity="0.55" filter="url(#soft)"/>

    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 424 96 L 432 118 L 454 126 L 432 134 L 424 156 L 416 134 L 394 126 L 416 118 Z"/>
      <path d="M 116 176 L 121 190 L 135 195 L 121 200 L 116 214 L 111 200 L 97 195 L 111 190 Z" opacity="0.8"/>
    </g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#8c6bff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
